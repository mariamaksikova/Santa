<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Комната</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
    </div>

    <div class="container">
        <div class="santa-image">
            <div class="santa-icon">🎅</div>
        </div>

        <h1 class="title" id="roomTitle">{{TITLE}}</h1>

        <div class="room-info" id="roomInfo">
            <div class="loading">Загрузка...</div>
        </div>

        <div class="registration-section" id="registrationSection" style="display: none;">
            <div class="form-card">
                <h2 class="form-title">Присоединиться к игре</h2>
                <div class="form-group">
                    <input type="text" id="regName" placeholder="Как тебя зовут?" 
                        class="form-input" required>
                    <textarea id="regWishes" placeholder="Чего бы ты хотел получить? (необязательно)" 
                        rows="4" class="form-input form-textarea"></textarea>
                    <button onclick="registerInRoom()" class="btn-white">
                        ✅ Присоединиться к игре
                    </button>
                </div>
            </div>
        </div>

        <div class="participants-section" id="participantsSection" style="display: none;">
            <h2 class="section-title">Участники</h2>
            <div class="participants-list" id="participantsList"></div>
        </div>

        <div class="assignment-section" id="assignmentSection" style="display: none;">
            <h2 class="section-title">Твоё назначение</h2>
            <div class="assignment-card" id="assignmentCard"></div>
        </div>
    </div>

    <script>
        const code = '{{CODE}}';
        let participantId = null;

        // Получаем participant_id из localStorage или URL
        const urlParams = new URLSearchParams(window.location.search);
        participantId = urlParams.get('participant_id') || localStorage.getItem('participant_id_' + code);

        async function loadRoomInfo() {
            try {
                const response = await fetch(`/api/room/${code}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('roomInfo').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    return;
                }

                // Обновляем заголовок
                document.getElementById('roomTitle').textContent = data.title || 'Комната';

                // Отображаем информацию о комнате
                document.getElementById('roomInfo').innerHTML = `
                    <div class="info-card">
                        <div class="info-item">
                            <span class="info-label">Участников:</span>
                            <span class="info-value">${data.current_count} / ${data.max_participants}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Статус:</span>
                            <span class="info-value status-${data.status}">${data.status === 'started' ? 'Игра началась!' : 'Ожидание участников...'}</span>
                        </div>
                    </div>
                `;

                // Скрываем форму регистрации, если пользователь уже зарегистрирован
                if (participantId) {
                    document.getElementById('registrationSection').style.display = 'none';
                }

                // Отображаем список участников (без пожеланий)
                if (data.participants.length > 0) {
                    document.getElementById('participantsSection').style.display = 'block';
                    const participantsHtml = data.participants.map(p => `
                        <div class="participant-card">
                            <div class="participant-name">${p.name}</div>
                        </div>
                    `).join('');
                    document.getElementById('participantsList').innerHTML = participantsHtml;
                }

                // Проверяем, зарегистрирован ли пользователь
                // Проверяем, есть ли текущий пользователь в списке участников
                const isRegistered = participantId && data.participants.some(p => p.id == participantId);
                if (!isRegistered && data.status === 'waiting') {
                    showRegistrationForm();
                } else if (isRegistered) {
                    document.getElementById('registrationSection').style.display = 'none';
                }

                // Если игра началась и есть participant_id, показываем назначение
                if (data.status === 'started' && participantId) {
                    loadAssignment(participantId);
                }
            } catch (error) {
                document.getElementById('roomInfo').innerHTML =
                    `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        async function loadAssignment(pid) {
            try {
                const response = await fetch(`/api/assignment/${code}/${pid}`);
                const data = await response.json();

                if (data.error) {
                    return;
                }

                document.getElementById('assignmentSection').style.display = 'block';
                document.getElementById('assignmentCard').innerHTML = `
                    <div class="assignment-content">
                        <div class="assignment-icon">🎁</div>
                        <div class="assignment-text">
                            <p class="assignment-label">Ты даришь подарок:</p>
                            <p class="assignment-name">${data.receiver_name}</p>
                            ${data.wishes ? `<p class="assignment-wishes">💝 Пожелания: ${data.wishes}</p>` : ''}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка загрузки назначения:', error);
            }
        }

        function showRegistrationForm() {
            document.getElementById('registrationSection').style.display = 'block';
        }

        async function registerInRoom() {
            const name = document.getElementById('regName').value;
            const wishes = document.getElementById('regWishes').value;

            if (!name.trim()) {
                alert('Введите имя!');
                return;
            }

            const btn = event.target;
            btn.innerHTML = '⏳ Присоединяемся...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, name, wishes })
                });

                const data = await response.json();

                if (data.success) {
                    // Сохраняем participant_id
                    localStorage.setItem('participant_id_' + code, data.participant_id);
                    participantId = data.participant_id;
                    
                    // Скрываем форму регистрации
                    document.getElementById('registrationSection').style.display = 'none';
                    
                    // Обновляем информацию о комнате
                    loadRoomInfo();
                } else {
                    alert('Ошибка: ' + (data.error || 'Не удалось присоединиться'));
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }

            btn.innerHTML = '✅ Присоединиться к игре';
            btn.disabled = false;
        }

        // Загружаем информацию при загрузке страницы
        loadRoomInfo();

        // Обновляем каждые 3 секунды, если игра ещё не началась
        setInterval(() => {
            fetch(`/api/room/${code}`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'waiting') {
                        loadRoomInfo();
                    }
                });
        }, 3000);
    </script>
</body>

</html>
